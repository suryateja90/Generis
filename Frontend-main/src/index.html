<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Generis - GEM</title>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link id="theme-css" rel="stylesheet" type="text/css" href="assets/layout/styles/theme/mdc-dark-indigo/theme.css">
</head>
<style>
    .loader-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #d8d8d8;
        display: flex;
        justify-content: center;
        align-items: center;

        z-index: 9999;
    }

    .loader {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 2s linear infinite;
    }

    @keyframes spin {
        0% {
            transform: rotate(0deg);
        }

        100% {
            transform: rotate(360deg);
        }
    }
</style>

<body>
    <div id="splash" class="loader-container">
        <div class="loader"></div>
    </div>
    <app-root></app-root>
</body>

</html>
